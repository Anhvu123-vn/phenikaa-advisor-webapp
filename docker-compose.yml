services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PHENIKAA_REMOTE_BROWSER: "1"
      PHENIKAA_NOVNC_DIR: "/usr/share/novnc"
      PHENIKAA_SECRET_KEY: "${PHENIKAA_SECRET_KEY}"
      PHENIKAA_COOKIE_SECURE: "${PHENIKAA_COOKIE_SECURE:-0}"
    shm_size: "1gb"
    volumes:
      - phenikaa_data:/app/data
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  phenikaa_data:
